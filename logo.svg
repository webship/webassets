  <line x1="188" y1="346" x2="188" y2="398" stroke-width="18"/>
  <line x1="216" y1="358" x2="216" y2="386" stroke-width="18"/>

  <!-- Bottom-right tile: Document (text lines) -->
  <rect x="272" y="272" width="200" height="200" rx="24"/>
  <line x1="306" y1="324" x2="438" y2="324"/>
  <line x1="306" y1="362" x2="438" y2="362"/>
