name: Web Assets
description: >-
  Gives editors a ready to use media library on a fresh Drupal site. Add
  images, documents, audio and video right after install, with the crops,
  breakpoints and responsive image styles already in place.
type: install
recipes:
  - foundation
install:
  # After the foundation recipe: the Web Assets module itself.
  - webassets
config:
  # The media displays are re-saved by the modules installed after this
  # recipe (dependencies recalculated): do not require them to be identical.
  strict: false
